<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <title>Học phần đã đăng ký</title>

    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/registered-courses.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <div id="sidebar-container"></div>

    <div class="main">

        <div id="topbar-container"></div>
        <div class="filter-card">

            <div class="semester-filter">

                <label>
                    <i class="fa-solid fa-calendar-days"></i>
                    Học kỳ
                </label>

                <select id="semesterSelect">
                    <option value="">
                        Chọn học kỳ
                    </option>
                </select>

            </div>

        </div>

        <!-- STATISTIC -->

        <div class="summary-grid">

            <div class="summary-card">
                <p>Số môn đã đăng ký</p>
                <h2 id="courseCount">0</h2>
            </div>

            <div class="summary-card">
                <p>Tổng số tín chỉ</p>
                <h2 id="totalCredits">0</h2>
            </div>

            <div class="summary-card">
                <p>Học kỳ</p>
                <!-- Thêm response trả về học  -->
                 <h2 id="semester">0</h2>
                <!-- <h2>Đang học</h2> -->
            </div>

        </div>

        <!-- TABLE -->

        <div class="registered-container">

            <h2>Danh sách học phần đã đăng ký</h2>

            <table class="course-table">

                <thead>

                    <tr>
                        <th>Mã lớp học phần</th>
                        <th>Tên môn học</th>
                        <th>Tín chỉ</th>
                        <th>Ngày đăng ký</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>

                </thead>

                <tbody id="courseTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="../js/sidebar.js"></script>
<script src="../js/topbar.js"></script>
<script src="../js/registered-courses.js"></script>

</body>
</html>
