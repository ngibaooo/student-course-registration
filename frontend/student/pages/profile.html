<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thông tin cá nhân</title>

    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/profile.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">
        <div id="sidebar-container"></div>
        <!-- MAIN -->

        <div class="main">

            <!-- <div class="topbar">

                <h1>Thông tin cá nhân</h1>

                <div class="user-box">

                    <div>
                        <div class="user-name" id="topbarFullName">
                            Loading...
                        </div>

                        <div class="user-id" id="topbarStudentId">
                            MSSV: ...
                        </div>
                    </div>

                    <div class="avatar-small" id="avatarSmall">
                        A
                    </div>

                </div>

            </div> -->
            <div id="topbar-container"></div>

            <!-- PROFILE HEADER -->

            <div class="profile-header">

                <div class="avatar-large" id="avatarLarge">
                    VA
                </div>

                <div class="profile-info">

                    <h2 id="fullName">
                        Loading...
                    </h2>

                    <p id="studentId">
                        MSSV: ...
                    </p>

                    <p id="departmentName">
                        Khoa: ...
                    </p>

                </div>

            </div>

            <!-- INFO -->

            <div class="info-grid">

                <div class="card">

                    <h3>Thông tin cá nhân</h3>

                    <div class="info-item">
                        <i class="fa-regular fa-user"></i>
                        <div>
                            <span>Họ và tên</span>
                            <!-- <strong>Nguyễn Văn A</strong> -->
                             <strong id="infoFullName"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-regular fa-calendar"></i>
                        <div>
                            <span>Ngày sinh</span>
                            <!-- <strong>15/05/2003</strong> -->
                             <strong id="dateOfBirth"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-regular fa-envelope"></i>
                        <div>
                            <span>Email</span>
                            <!-- <strong>nva@student.edu.vn</strong> -->
                             <strong id="email"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-phone"></i>
                        <div>
                            <span>Số điện thoại</span>
                            <!-- <strong>0123456789</strong> -->
                             <strong id="phone"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <span>Địa chỉ</span>
                            <!-- <strong>123 Đường ABC, Quận XYZ, Hà Nội</strong> -->
                             <strong id="address"></strong>
                        </div>
                    </div>

                </div>

                <div class="card">

                    <h3>Thông tin học tập</h3>

                    <div class="info-item">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <span>MSSV</span>
                            <!-- <strong>2021001234</strong> -->
                             <strong id="studyStudentId"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <span>Khoa</span>
                            <!-- <strong>Công nghệ thông tin</strong> -->
                             <strong id="studyDepartment"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <span>Giới tính</span>
                            <!-- <strong>Kỹ thuật phần mềm</strong> -->
                            <strong id="gender"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <span>Lớp</span>
                            <strong>K46-CNTT</strong>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <span>Khóa học</span>
                            <strong id="enrollmentYear"></strong>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/topbar.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
