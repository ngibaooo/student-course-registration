<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="container">
        <div id="sidebar-container"></div>
        <div class="main">
            <!-- Topbar container -->
            <div id="topbar-container"></div>


            <div class="summary-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin: 30px;">
                <div class="summary-card" style="background: white; border-radius: 15px; padding: 30px; text-align: center;">
                    <p style="color: #6b7280; margin-bottom: 10px;">Tổng số sinh viên</p>
                    <h2 id="totalStudents" style="color: #2563eb; font-size: 36px;">...</h2>
                </div>
                <div class="summary-card" style="background: white; border-radius: 15px; padding: 30px; text-align: center;">
                    <p style="color: #6b7280; margin-bottom: 10px;">Tổng số môn học</p>
                    <h2 id="totalCourses" style="color: #2563eb; font-size: 36px;">...</h2>
                </div>
                <div class="summary-card" style="background: white; border-radius: 15px; padding: 30px; text-align: center;">
                    <p style="color: #6b7280; margin-bottom: 10px;">Tổng số học kỳ</p>
                    <h2 id="totalSemesters" style="color: #2563eb; font-size: 36px;">...</h2>
                </div>
                <div class="summary-card" style="background: white; border-radius: 15px; padding: 30px; text-align: center;">
                    <p style="color: #6b7280; margin-bottom: 10px;">Lớp học phần</p>
                    <h2 id="totalClasses" style="color: #2563eb; font-size: 36px;">...</h2>
                </div>
            </div>


            <div style="display: flex; gap: 25px; margin: 0 30px 30px;">
                <div class="registered-container" style="background: white; padding: 25px; border-radius: 15px; flex: 2;">
                    <h2 style="margin-bottom: 25px;">Lớp học phần mới tạo</h2>
                    <table class="course-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid #e5e7eb;"><th style="text-align: left; padding: 15px;">Mã lớp HP</th><th style="text-align: left; padding: 15px;">Tên môn học</th><th style="text-align: left; padding: 15px;">Giảng viên</th><th style="text-align: left; padding: 15px;">Sĩ số</th><th style="text-align: center; padding: 15px;">Thao tác</th></tr>
                        </thead>
                        <tbody id="recentClassesTable">
                            <tr><td colspan="5" style="text-align: center; padding: 20px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="background: white; padding: 25px; border-radius: 15px; flex: 1; text-align: center; display: flex; flex-direction: column; gap: 30px;">
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="statusChart"></canvas>
                    </div>
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="genderChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
    </div>


    <script src="../js/main.js" data-page="dashboard"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
